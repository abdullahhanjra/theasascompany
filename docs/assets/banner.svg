<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="60%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="bEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="bCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="bBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="0" y="0" width="960" height="320" rx="16" fill="url(#bannerBg)" stroke="url(#bBorder)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="160" r="140" fill="#10B981" opacity="0.12" filter="url(#heroGlow)" />
  <circle cx="820" cy="80" r="120" fill="#06B6D4" opacity="0.08" filter="url(#heroGlow)" />

  <!-- Subtle Engineering Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
  </g>

  <!-- Left Side: Iconic Logo Emblem Mark -->
  <g transform="translate(60, 50)">
    <!-- Squircle Container -->
    <rect x="0" y="0" width="220" height="220" rx="48" fill="#0A0F1D" stroke="url(#bBorder)" stroke-width="2" />
    
    <!-- Outer Reality Gate Ring -->
    <circle cx="110" cy="110" r="70" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="6 6" />
    <circle cx="110" cy="110" r="70" fill="none" stroke="url(#bCyan)" stroke-width="2.5" stroke-dasharray="28 170" stroke-linecap="round" />

    <!-- The Monogram 'B' -->
    <rect x="62" y="55" width="20" height="110" rx="10" fill="url(#bEmerald)" />
    <path d="M 82 55 H 124 C 146 55, 160 67, 160 85 C 160 102, 146 110, 124 110 H 82 Z" 
          fill="none" stroke="url(#bEmerald)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 82 108 H 130 C 154 108, 170 120, 170 138 C 170 156, 154 165, 130 165 H 82 Z" 
          fill="none" stroke="url(#bCyan)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Center Prompt '>' -->
    <path d="M 98 102 L 112 110 L 98 118" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side: Brand Content & Hook -->
  <!-- Top Pill: Status -->
  <g transform="translate(320, 55)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#052E16" stroke="#10B981" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#22C55E" />
    <text x="28" y="17" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
      REALITY GATE CERTIFIED • V3.1
    </text>
  </g>

  <!-- Title: THE BORING COMPANY -->
  <text x="320" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
    THE BORING COMPANY
  </text>

  <!-- Hook Subtitle -->
  <text x="320" y="162" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="600">
    Stop babysitting chatbots. Run a real AI software company in your terminal.
  </text>
  <text x="320" y="188" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="400">
    72 autonomous specialists plan, code, and mathematically prove every fix on your machine.
  </text>

  <!-- Badges / Feature Pills Bar -->
  <g transform="translate(320, 222)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="132" height="32" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">72 Specialists</text>

    <!-- Pill 2 -->
    <rect x="144" y="0" width="144" height="32" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
    <text x="158" y="20" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">6 Departments</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="156" height="32" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
    <text x="314" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">Zero Dependencies</text>

    <!-- Pill 4 -->
    <rect x="468" y="0" width="144" height="32" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
    <text x="482" y="20" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">Exit Code: 0 ($?)</text>
  </g>
</svg>
