<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="10" y="10" width="220" height="220" rx="52" fill="url(#bgGrad)" stroke="url(#borderStroke)" stroke-width="2.5" />

  <!-- Subtle Inner Grid Matrix -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="10" y1="70" x2="230" y2="70" />
    <line x1="10" y1="120" x2="230" y2="120" />
    <line x1="10" y1="170" x2="230" y2="170" />
    <line x1="70" y1="10" x2="70" y2="230" />
    <line x1="120" y1="10" x2="120" y2="230" />
    <line x1="170" y1="10" x2="170" y2="230" />
  </g>

  <!-- Ambient Core Glow -->
  <circle cx="120" cy="120" r="50" fill="#10B981" opacity="0.12" filter="url(#softGlow)" />

  <!-- Outer Reality Gate Interlock Ring -->
  <circle cx="120" cy="120" r="74" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="8 6" />
  <circle cx="120" cy="120" r="74" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-dasharray="32 180" stroke-linecap="round" />

  <!-- The Architectural Monogram: The Iconic "B" + Boring Tunnel Portal -->
  <!-- Left Spine (Titanium Monolith Pillar) -->
  <rect x="68" y="62" width="22" height="116" rx="11" fill="url(#neonEmerald)" filter="url(#laserGlow)" />

  <!-- Upper Arch (Engineering Architecture) -->
  <path d="M 90 62 
           H 134 
           C 156 62, 172 74, 172 94 
           C 172 112, 156 122, 134 122 
           H 90 Z" 
        fill="none" 
        stroke="url(#neonEmerald)" 
        stroke-width="14" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Lower Arch (Reality Gate Foundation) -->
  <path d="M 90 118 
           H 142 
           C 166 118, 184 130, 184 150 
           C 184 168, 166 178, 142 178 
           H 90 Z" 
        fill="none" 
        stroke="url(#neonCyan)" 
        stroke-width="14" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Dynamic Center Laser Prompt (Autonomous Terminal Chevron '>') -->
  <path d="M 108 110 L 122 120 L 108 130" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#laserGlow)" />
</svg>
